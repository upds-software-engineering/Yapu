name: CI

# ============================================================================
# YAPU — Integración continua de la PWA estática (Astro 5 + React 19).
#
# Puertas de calidad, en orden de dependencia:
#   quality      -> lint (ESLint + tsc + astro check) y capas hexagonales
#   test         -> pirámide Vitest con cobertura (umbrales en vitest.config.ts)
#   build        -> build estático + verificación de las 24+ páginas bajo /Yapu/
#   e2e          -> flujos, accesibilidad (a11y) y UX con Playwright sobre dist/
#   trazabilidad -> matriz RF/RNF/RS/RN a partir de los JUnit generados
#
# Todos los scripts invocados existen en package.json. El artefacto `dist` es el
# que reutiliza (o recompila) el despliegue de deploy.yml.
# ============================================================================

on:
  push:
    branches:
      - main
      - dev
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - dev

# Una ejecución por rama/PR: la nueva cancelación invalida la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  # --------------------------------------------------------------------------
  # 1) Calidad estática: lint + tipos + fronteras de la arquitectura hexagonal.
  # --------------------------------------------------------------------------
  quality:
    name: Calidad (lint + capas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js desde .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc fija legacy-peer-deps=true: se declara explícitamente en el
      # comando para que la instalación sea determinista aunque cambie el lock.
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Lint, tipos y chequeo de Astro
        run: npm run lint

      - name: Verificar fronteras entre capas (hexagonal)
        run: npm run lint:capas

  # --------------------------------------------------------------------------
  # 2) Pruebas con cobertura: unitarias + contrato + componentes.
  # --------------------------------------------------------------------------
  test:
    name: Pruebas y cobertura
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js desde .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Ejecutar la suite con cobertura
        run: npm run test:coverage

      # La evidencia se sube aunque la suite falle: sin ella no hay diagnóstico.
      - name: Subir cobertura y JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-y-junit
          path: |
            reports/coverage
            reports/junit
          if-no-files-found: warn
          retention-days: 7

      # Resumen legible en la pestaña Summary: cobertura global y tests del JUnit.
      - name: Publicar resumen de cobertura y pruebas
        if: always()
        run: |
          node -e "const fs=require('node:fs');const out=[];const resumen='reports/coverage/coverage-summary.json';if(fs.existsSync(resumen)){const d=JSON.parse(fs.readFileSync(resumen,'utf8'));const t=d.total||{};const p=(k)=>t[k]?t[k].pct:'n/d';out.push('### Cobertura','','| Métrica | % |','| --- | --- |','| lines | '+p('lines')+' |','| statements | '+p('statements')+' |','| functions | '+p('functions')+' |','| branches | '+p('branches')+' |');}else{out.push('### Cobertura','','No se generó reports/coverage/coverage-summary.json.');}const junit='reports/junit/vitest.xml';if(fs.existsSync(junit)){const xml=fs.readFileSync(junit,'utf8');const a=(n)=>{const m=new RegExp(n+'=\"([0-9]+)\"').exec(xml);return m?m[1]:'n/d';};out.push('','### Pruebas (JUnit de Vitest)','','- Tests: '+a('tests'),'- Fallidos: '+a('failures'),'- Errores: '+a('errors'),'- Omitidos: '+a('skipped'));}else{out.push('','No se generó reports/junit/vitest.xml.');}fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out.join(String.fromCharCode(10))+String.fromCharCode(10));console.log(out.join(String.fromCharCode(10)));"

  # --------------------------------------------------------------------------
  # 3) Build estático + verificación estructural de las rutas.
  # --------------------------------------------------------------------------
  build:
    name: Build y verificación de páginas
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js desde .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar el sitio estático
        run: npm run build

      # verificar-paginas.mjs deduce las rutas de dist/ y de astro.config.mjs:
      # exige portada + dashboard + community + docente + 10 lecciones + 10
      # evaluaciones (24+ páginas), sw.js, manifest.json y favicon.svg, y que
      # ningún HTML enlace assets sin el prefijo /Yapu. No hay listas a mano aquí.
      - name: Verificar las rutas generadas bajo /Yapu/
        run: npm run verificar:paginas

      - name: Subir el artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # --------------------------------------------------------------------------
  # 4) E2E sobre el build real: flujos, accesibilidad y UX en dos viewports.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (flujos + a11y + ux)
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      # Playwright sirve la compilación con `npm run preview` en /Yapu/.
      YAPU_BASE_URL: http://localhost:9500/Yapu/
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js desde .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Descargar el artefacto dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      # Cada suite escribe su propio JUnit (PLAYWRIGHT_JUNIT_OUTPUT_NAME) para que
      # ningún reporte sobrescriba al anterior: los tres alimentan la trazabilidad.
      - name: E2E · flujos críticos
        if: always()
        run: npm run test:e2e
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit/playwright-flujos.xml

      - name: E2E · accesibilidad (a11y)
        if: always()
        run: npm run test:a11y
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit/playwright-a11y.xml

      - name: E2E · experiencia de usuario (leyes UX)
        if: always()
        run: npm run test:e2e:ux
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit/playwright-ux.xml

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Subir evidencias JUnit de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-playwright
          path: reports/junit
          if-no-files-found: warn
          retention-days: 7

      - name: Subir trazas y capturas de fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # 5) Matriz de trazabilidad RF/RNF/RS/RN a partir de los JUnit de test y e2e.
  # --------------------------------------------------------------------------
  trazabilidad:
    name: Matriz de trazabilidad
    needs: [test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js desde .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      # merge-multiple recompone reports/junit/ con Vitest + Playwright, que es
      # exactamente lo que lee `npm run reports:trazabilidad`.
      - name: Descargar JUnit de Vitest
        uses: actions/download-artifact@v4
        with:
          name: cobertura-y-junit
          path: reports
          merge-multiple: true

      - name: Descargar JUnit de Playwright
        uses: actions/download-artifact@v4
        with:
          name: junit-playwright
          path: reports
          merge-multiple: true

      - name: Generar la matriz de trazabilidad
        run: npm run reports:trazabilidad

      - name: Subir la matriz de trazabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matriz-trazabilidad
          path: Docs/testing/matriz-trazabilidad.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar la matriz en el resumen
        if: always()
        run: |
          archivo="Docs/testing/matriz-trazabilidad.md"
          if [ -f "$archivo" ]; then
            {
              echo "## Matriz de trazabilidad"
              echo ""
              cat "$archivo"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se generó $archivo (revisa los artefactos JUnit)."
          fi
